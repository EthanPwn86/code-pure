<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Pure</title>
  <style>
    :root {
      --bg:#0a0d12; --panel:#131923; --panel2:#0e141d; --border:#2b3442;
      --text:#f2efe5; --muted:#a8b0be; --gold:#c9aa68; --gold2:#9e824b;
      --ok:#6fd08c; --bad:#f17d7d;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#121927 0,#0a0d12 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}
    .wrap{max-width:980px;margin:auto;padding:34px 18px 56px}
    header{text-align:center;margin-bottom:24px}
    h1{font-family:Georgia,serif;letter-spacing:.18em;font-size:2rem;margin:0 0 6px}
    header p{color:var(--muted);margin:0}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:12px 16px;background:#1a1711;color:var(--text)}
    button:hover{border-color:var(--gold2)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .tab.active,.primary{background:var(--gold);border-color:var(--gold);color:#12100c}
    .panel{background:rgba(19,25,35,.96);border:1px solid var(--border);border-radius:15px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
    .hidden{display:none!important}
    label{display:block;font-weight:750;margin:15px 0 7px}
    input,textarea,select{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);padding:12px 13px;font:inherit;outline:none}
    input:focus,textarea:focus,select:focus{border-color:var(--gold2)}
    textarea{min-height:120px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .status,.result{margin-top:16px;padding:14px;border:1px solid var(--border);border-radius:11px;background:var(--panel2);white-space:pre-wrap;line-height:1.55}
    .status{color:var(--muted)}
    .ok{color:var(--ok)} .bad{color:var(--bad)}
    .resultText{white-space:pre-wrap;font-family:Georgia,serif;font-size:1.04rem;line-height:1.75}
    .meta{margin-top:12px;color:var(--muted);font-size:.9rem}
    .rules{margin-top:14px;text-align:center;color:var(--muted);font-size:.86rem}
    .copy{margin-top:12px}
    @media(max-width:720px){.row,.tabs{grid-template-columns:1fr}.wrap{padding:18px 10px 34px}.panel{padding:16px}h1{font-size:1.65rem}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>CODE PURE</h1>
      <p>Encodeur et décodeur de messages</p>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="encoder">ENCODER</button>
      <button class="tab" data-tab="decoder">DÉCODER</button>
    </div>

    <section id="encoder" class="panel">
      <label for="secret">Message secret</label>
      <input id="secret" value="REU QG PDT PL" placeholder="Ex. REU QG PDT PL" />

      <div class="row">
        <div>
          <label for="context">Contexte apparent</label>
          <input id="context" placeholder="Ex. Je préviens un collègue au sujet des prochains cours." />
        </div>
        <div>
          <label for="tone">Ton</label>
          <select id="tone">
            <option>Naturel</option>
            <option>Amical</option>
            <option>Formel</option>
            <option>Professionnel</option>
            <option>Mystérieux</option>
          </select>
        </div>
      </div>

      <label for="visibleInfo">Informations visibles à intégrer <span style="color:var(--muted);font-weight:400">(facultatif)</span></label>
      <input id="visibleInfo" placeholder="Ex. Je serai disponible vendredi en fin de journée." />

      <label for="relation">Destinataire / relation <span style="color:var(--muted);font-weight:400">(facultatif)</span></label>
      <input id="relation" placeholder="Ex. un professeur, un ami proche, un collègue..." />

      <div class="actions">
        <button id="generateBtn" class="primary">GÉNÉRER ET VÉRIFIER</button>
        <button id="regenerateBtn" class="hidden">RÉGÉNÉRER</button>
      </div>

      <div id="generationStatus" class="status hidden"></div>

      <div id="generationResult" class="result hidden">
        <div id="resultText" class="resultText"></div>
        <div id="resultMeta" class="meta"></div>
        <button id="copyBtn" class="copy">COPIER LE TEXTE</button>
      </div>
    </section>

    <section id="decoder" class="panel hidden">
      <label for="decodeInput">Lettre ou texte reçu</label>
      <textarea id="decodeInput" placeholder="Colle ici le texte contenant la zone codée entre parenthèses..."></textarea>
      <div class="actions">
        <button id="decodeBtn" class="primary">DÉCODER</button>
      </div>
      <div id="decodeResult" class="result hidden"></div>
    </section>

    <div class="rules">( ) = zone codée · 2312 = positions · , = espace · 21 = inversion par paires</div>
  </main>
  <script src="chat.js"></script>
</body>
</html>
